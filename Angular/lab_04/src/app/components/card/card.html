@if (product) {
  <div class="card" style="width: 18rem;">
    <img src="/images/product_image.png" class="card-img-top" alt="...">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="card-title">{{product.name}}</h5>
        <p class="card-text fw-bold fs-1">$ {{product.price}}</p>
      </div>

      <div>
        <p class="text-secondary">{{product.description}}</p>
      </div>

      <div class="d-flex gap-1 mb-1">
        <button class="btn btn-primary flex-grow-1" (click)="updateProduct()">Update</button>
        <!-- Wish -->
        <button class="btn btn-warning" (click)="loveProduct()">
          <i class="bi bi-heart"></i>
        </button>
      </div>

      <div>
        <button class="btn btn-danger w-100" (click)="deleteProduct()">Delete <i class="bi bi-trash"></i> </button>
      </div>

    </div>
  </div>
}

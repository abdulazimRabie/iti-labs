<div class="p-3">
  <h2 class="mb-3">
    Wishlist
    <span class="badge bg-danger ms-2">{{ wishlist.length }}</span>
  </h2>

  @if (wishlist.length === 0) {
    <div class="alert alert-info text-center">
      Your wishlist is empty. Start adding products!
    </div>
  }

  <div class="row g-3">
    @for (item of wishlist; track item.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">

          <!-- Product Image -->
          <!-- <img
            [src]="item.images[0]"
            [alt]="item.name"
            class="card-img-top object-fit-cover"
            style="height: 200px;"
            onerror="this.src='https://placehold.co/400x200?text=No+Image'"
          > -->

          <div class="card-body d-flex flex-column">

            <!-- Name & Badge -->
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h5 class="card-title mb-0">{{ item.name }}</h5>
              <span class="badge bg-success ms-2">${{ item.price }}</span>
            </div>

            <!-- Description -->
            <p class="card-text text-muted small flex-grow-1">{{ item.description }}</p>

            <!-- Details -->
            <ul class="list-group list-group-flush mb-3">
              <li class="list-group-item px-0 d-flex justify-content-between">
                <span class="fw-bold">Seller</span>
                <span>{{ item.seller }}</span>
              </li>
              <li class="list-group-item px-0 d-flex justify-content-between">
                <span class="fw-bold">Color</span>
                <span class="d-flex align-items-center gap-2">
                  <!-- Color circle -->
                  <span
                    class="rounded-circle border"
                    [style.background-color]="item.color"
                    style="width: 16px; height: 16px; display: inline-block;"
                  ></span>
                  {{ item.color }}
                </span>
              </li>
              <li class="list-group-item px-0 d-flex justify-content-between">
                <span class="fw-bold">ID</span>
                <span class="text-muted">#{{ item.id }}</span>
              </li>
            </ul>

            <!-- Delete Button -->
            <button
              class="btn btn-danger w-100 mt-auto"
              (click)="deleteProductFromWishlist(item.id)"
            >
              🗑 Remove from Wishlist
            </button>

          </div>
        </div>
      </div>
    }
  </div>
</div>

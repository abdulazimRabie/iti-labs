<div class="p-3 mt-3">
  <h2>Products</h2>

  <div class="d-flex flex-wrap gap-3 justify-content-center">
    @if(products_list.length > 0) {
      @for (product of products_list; track products_list[$index].id) {
        <app-card
          [product]="product"
          (deleteProduct_e)="deletProduct($event)"
          (updateProduct_e)="updateProduct($event)"
          (loveProduct_e)="loveProduct($event)"
          />
      }
    }@else {
      <p class="fs-1">No Products Yet <i class="bi bi-emoji-frown"></i></p>
    }
  </div>
</div>

@if (product) {
  <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100" style="width: 320px;">

    <!-- Product Image -->
    <div class="position-relative overflow-hidden" style="height: 220px;">
      <img
        src="/images/{{ product.images[0] }}"
        class="w-100 h-100 object-fit-cover"
        alt="{{ product.name }}"
        style="transition: transform 0.3s ease;"
        onmouseover="this.style.transform='scale(1.05)'"
        onmouseout="this.style.transform='scale(1)'"
      >
      <!-- Price Badge -->
      <span class="position-absolute top-0 end-0 m-3 badge bg-success rounded-pill px-3 py-2 fs-6 shadow-sm">
        ${{ product.price }}
      </span>
    </div>

    <!-- Card Body -->
    <div class="card-body d-flex flex-column gap-3 p-3">

      <!-- Product Name -->
      <div>
        <h6 class="card-title fw-bold mb-0 text-truncate fs-5">{{ product.name }}</h6>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex gap-2 mt-auto">
        <button
          class="btn btn-success flex-grow-1 rounded-3 fw-semibold"
          (click)="addToCard()"
        >
          <i class="bi bi-cart-plus me-1"></i> Add to Cart
        </button>

        <button
          class="btn btn-outline-secondary rounded-3 px-3"
          (click)="goToProductDetails(product.id)"
          title="View Details"
          routerLink="{{product.id}}"
        >
          <i class="bi bi-eye"></i>
        </button>
      </div>

    </div>
  </div>
}

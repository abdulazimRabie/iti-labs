<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3 sticky-top">

  <!-- Brand -->
  <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4 text-success" routerLink="home">
    <span class="bg-success text-white rounded-2 px-2 py-1 fs-6">AZ</span>
    AZIMSTORE
  </a>

  <!-- Nav Links & Actions -->
  <div class="d-flex align-items-center gap-4 ms-auto">

    <div class="d-flex gap-3">
      <a class="text-decoration-none fw-semibold nav-link" routerLink="about" routerLinkActive="text-success">
        About
      </a>
      <a class="text-decoration-none fw-semibold nav-link" routerLink="products" routerLinkActive="text-success">
        Products
      </a>
    </div>

    <div class="vr text-muted opacity-25"></div>
    <!-- Cart Icon — only for authenticated users -->
    @if (authService.isAuthenticated()) {
      <a class="btn btn-outline-success rounded-3 position-relative px-3" routerLink="cart">
        <i class="bi bi-bag"></i>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success" style="font-size: 10px;">
          {{ cartItemCount }}
        </span>
      </a>
    }

    <!-- Login / Logout Button -->
    @if (authService.isAuthenticated()) {
      <button class="btn btn-outline-danger rounded-3 px-4 fw-semibold" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>
    } @else {
      <a class="btn btn-success rounded-3 px-4 fw-semibold shadow-sm" routerLink="/az/login">
        <i class="bi bi-person me-1"></i> Login
      </a>
    }
